<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOC Console // System Secured</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=JetBrains+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="defense.css">
    <link rel="stylesheet" href="Defense_End.css">
    
<script src="https://unpkg.com/peerjs@1.5.0/dist/peerjs.min.js"></script>
</head>

<body>
    <script src="https://unpkg.com/peerjs@1.5.0/dist/peerjs.min.js" ></script>
    <script type = "text/javascript" defer>
    var peer = new Peer();
	peer.on('open', function(id) {
		console.log('My peer ID is: ' + id);
	});
	peerID = 'NYPOH27'
	function connect(peerID){
		var conn = peer.connect(peerID);
        console.log(conn)
        peer.on('error', function(err) { console.log(err) });
		conn.on('open', function() {
			// Receive messages
			conn.on('data', function(data) {
				console.log('Received', data);
			});
			
			// Send messages
			conn.send('Hello from phone!');
		});		
	}
    connect()
</script>
    <canvas id="matrix"></canvas>
    <div class="wrap">
        <div class="badge">■ SYSTEM SECURED ■</div>

        <div class="console">
            <div class="bar"><i></i><i></i><i></i></div>
            <div id="log"></div>
        </div>

        <div class="summary" id="summary">
            <div class="stat">
                <div class="num">2</div>
                <div class="lbl">Threats Neutralized</div>
            </div>
            <div class="stat">
                <div class="num">100%</div>
                <div class="lbl">Uptime Restored</div>
            </div>
            <div class="stat">
                <div class="num">0</div>
                <div class="lbl">Active Intrusions</div>
            </div>
        </div>

        <p>
            Congratulations on a successful defense against the red team! Thanks to your efforts, the team has
            successfully fended the red team off long enough. Thanks for playing!
        </p>

        <form action="">
            <button onclick="verify()">Take Quiz for Certificate &gt;</button>
        </form>
        

    </div>
</body>


<script src="matrix.js"></script>
<script src="Defense_End_ui.js"></script>


</html>
