<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOC Console // Select Role</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=JetBrains+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="defense.css">
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <canvas id="matrix"></canvas>
    <div class="wrap">
        <div class="topbar">
            <span class="title">[ OPEN HOUSE // CYBER RANGE ]<span class="cursor"></span></span>
            <span class="led secure"><span class="dot"></span>AWAITING OPERATOR</span>
        </div>

        <p class="intro">Welcome Operator. Choose Your Role.</p>
        <p class="prompt">Select A Role</p>

        <div class="roles">
            <a class="role defender" href="Defence_Start.html">
                <img src="shield.png" alt="Defender">
                Defender
            </a>

            <a class="role attacker" href="Attack_Start.html">
                <img src="sword.png" alt="Attacker">
                Attacker
            </a>
        </div>
    </div>
</body>

<script src="matrix.js"></script>

</html>
