<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOC Console // Certification Quiz</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=JetBrains+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="defense.css">
    <link rel="stylesheet" href="Quiz.css">
    <script src="Defence_quiz.js" defer></script>
</head>

<body>
    <canvas id="matrix"></canvas>
    <div class="wrap">
        <div class="topbar">
            <span class="title">[ BLUE TEAM // CERTIFICATION EXAM ]<span class="cursor"></span></span>
            <span class="led secure"><span class="dot"></span>EXAM IN PROGRESS</span>
        </div>

        <p class="intro">
            Final step, operator. Answer all 5 questions correctly to earn your Blue Team certificate.
        </p>

        <div class="quiz-card">
            <div class="question">
                <label class="q-title"><span class="qnum">Qn 1</span>Which reason does NOT explain why sensitive functions should not be run client side?</label>
                <label><input type="radio" name='q1' id='ans1'> A It uses too much ram</label>
                <label><input type="radio" name='q1' id='ans2'> B It exposes sensitive information about how the website works</label>
                <label><input type="radio" name='q1' id='ans3'> C It potentially allows attackers to bypass security mechanisms</label>
                <label><input type="radio" name='q1' id='ans4'> D It allows attackers to manipulate how the website works on their end</label>
            </div>

            <div class="question">
                <label class="q-title"><span class="qnum">Qn 2</span>What does inspect element do?</label>
                <label><input type="radio" name='q2' id='ans5'> A It lets you view a model of a random element from the periodic table, including the protons, neutrons and electrons</label>
                <label><input type="radio" name='q2' id='ans6'> B It exposes the source code that makes up the website, including any client side scripts running</label>
                <label><input type="radio" name='q2' id='ans7'> C It lets you pick a element and learn how to bend it. If you inspect enough elements, you can become the avatar</label>
                <label><input type="radio" name='q2' id='ans8'> D It lets you watch a video from Element Animations, the people behind Villager News</label>
            </div>

            <div class="question">
                <label class="q-title"><span class="qnum">Qn 3</span>What happens if a website has broken access controls?</label>
                <label><input type="radio" name='q3' id='ans9'> A Nobody can access the website, including administrators. A new website needs to be created from scratch</label>
                <label><input type="radio" name='q3' id='ans10'> B The website becomes sapient, and attemps to take over the world.</label>
                <label><input type="radio" name='q3' id='ans11'> C Anyone with the technical skills can access sensitive pages on the website</label>
                <label><input type="radio" name='q3' id='ans12'> D The administrator needs to hit the servers with a wrench and some metal until the access controls are fixed</label>
            </div>

            <div class="question">
                <label class="q-title"><span class="qnum">Qn 4</span>Why are hidden pages a bad security practice</label>
                <label><input type="radio" name='q4' id='ans13'> A They are so well hidden even the people who need to access the page can't</label>
                <label><input type="radio" name='q4' id='ans14'> B They can be found easily with many different tools available</label>
                <label><input type="radio" name='q4' id='ans15'> C Hiding pages gives them a chance to form secret societies without the administrators knowledge</label>
                <label><input type="radio" name='q4' id='ans16'> D hidden pages still need passwords to find, so no point in using them</label>
            </div>

            <div class="question">
                <label class="q-title"><span class="qnum">Qn 5</span>If you have authority to hack your target, what are you?</label>
                <label><input type="radio" name='q5' id='ans17'> A White hat</label>
                <label><input type="radio" name='q5' id='ans18'> B Grey Hat</label>
                <label><input type="radio" name='q5' id='ans19'> C Black Hat</label>
                <label><input type="radio" name='q5' id='ans20'> D Red Hat</label>
            </div>

            <input type="button" value="Submit Exam" onclick="verify()">
            <p id='fail'></p>
        </div>
    </div>
</body>

<script src="matrix.js"></script>

</html>
